<svg xmlns="http://www.w3.org/2000/svg" width="360" height="212" viewBox="0 0 360 212" role="img" aria-labelledby="title desc">
<title>Methodology tree</title>
<desc>Tree-style methodology: three branches — on-silicon ESP32-S3/STM32 Blue Pill, SCAPS-1D device model, system models — converge on common-boundary feasibility.</desc>
<style>
  .node { fill: #ffffff; stroke: #222; stroke-width: 1.35; rx: 7; ry: 7; }
  .node-root { fill: #f3f3f3; stroke: #222; }
  .node-blue { fill: #e8f0fe; stroke: #1a4fb5; }
  .node-paper { fill: #fef7e0; stroke: #b7791f; }
  .t-title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #111; }
  .t-label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9.2px; fill: #111; }
  .t-micro { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #555; }
  .edge { stroke: #222; stroke-width: 1.25; fill: none; }
</style>

<!-- Root -->
<rect x="90" y="8" width="180" height="20" class="node node-root"/>
<text x="180" y="21.5" text-anchor="middle" class="t-title">Common-Boundary Methodology</text>

<!-- Branch level -->
<line x1="180" y1="28" x2="180" y2="36" class="edge"/>
<line x1="62" y1="36" x2="298" y2="36" class="edge"/>
<line x1="62" y1="36" x2="62" y2="44" class="edge"/>
<line x1="180" y1="36" x2="180" y2="44" class="edge"/>
<line x1="298" y1="36" x2="298" y2="44" class="edge"/>

<rect x="10" y="44" width="104" height="20" class="node node-blue"/>
<text x="62" y="57" text-anchor="middle" class="t-title">On-Silicon Harness</text>

<rect x="128" y="44" width="104" height="20" class="node node-blue"/>
<text x="180" y="57" text-anchor="middle" class="t-title">Device Model (sim.)</text>

<rect x="246" y="44" width="104" height="20" class="node node-blue"/>
<text x="298" y="57" text-anchor="middle" class="t-title">System Models</text>

<!-- Leaves On-Silicon: two side-by-side + one below -->
<line x1="62" y1="64" x2="62" y2="74" class="edge"/>
<line x1="32" y1="74" x2="92" y2="74" class="edge"/>
<line x1="32" y1="74" x2="32" y2="83" class="edge"/>
<line x1="92" y1="74" x2="92" y2="83" class="edge"/>

<rect x="2" y="83" width="60" height="16" class="node"/>
<text x="32" y="93.5" text-anchor="middle" class="t-label">ESP32 71µs</text>
<rect x="62" y="83" width="60" height="16" class="node"/>
<text x="92" y="93.5" text-anchor="middle" class="t-label">STM32 239µs</text>
<text x="32" y="103" text-anchor="middle" class="t-micro">8.2µJ</text>
<text x="92" y="103" text-anchor="middle" class="t-micro">28µJ Blue Pill</text>

<line x1="62" y1="103" x2="62" y2="112" class="edge"/>
<rect x="16" y="112" width="92" height="15" class="node"/>
<text x="62" y="122" text-anchor="middle" class="t-label">4 ms wake · [8–470µJ]</text>

<!-- Leaves Device -->
<line x1="180" y1="64" x2="180" y2="74" class="edge"/>
<line x1="150" y1="74" x2="210" y2="74" class="edge"/>
<line x1="150" y1="74" x2="150" y2="83" class="edge"/>
<line x1="210" y1="74" x2="210" y2="83" class="edge"/>

<rect x="122" y="83" width="56" height="16" class="node"/>
<text x="150" y="93.5" text-anchor="middle" class="t-label">MAPbI₃</text>
<rect x="182" y="83" width="56" height="16" class="node"/>
<text x="210" y="93.5" text-anchor="middle" class="t-label">0.05mW/cm²</text>
<text x="150" y="103" text-anchor="middle" class="t-micro">SCAPS-1D</text>
<text x="210" y="103" text-anchor="middle" class="t-micro">white LED</text>

<line x1="180" y1="103" x2="180" y2="112" class="edge"/>
<rect x="138" y="112" width="84" height="15" class="node"/>
<text x="180" y="122" text-anchor="middle" class="t-label">1.6–2.1 eV · 26.1% peak</text>

<!-- Leaves System -->
<line x1="298" y1="64" x2="298" y2="74" class="edge"/>
<line x1="268" y1="74" x2="328" y2="74" class="edge"/>
<line x1="268" y1="74" x2="268" y2="83" class="edge"/>
<line x1="328" y1="74" x2="328" y2="83" class="edge"/>

<rect x="240" y="83" width="56" height="16" class="node"/>
<text x="268" y="93.5" text-anchor="middle" class="t-label">PMIC 1.68µW</text>
<rect x="300" y="83" width="56" height="16" class="node"/>
<text x="328" y="93.5" text-anchor="middle" class="t-label">2F / 8.6J</text>
<text x="268" y="103" text-anchor="middle" class="t-micro">1.32–1.68µW</text>
<text x="328" y="103" text-anchor="middle" class="t-micro">24h dispatch</text>

<line x1="298" y1="103" x2="298" y2="112" class="edge"/>
<rect x="256" y="112" width="84" height="15" class="node"/>
<text x="298" y="122" text-anchor="middle" class="t-label">85% + 8.5µW LDO</text>

<!-- Convergence -->
<line x1="62" y1="127" x2="62" y2="148" class="edge"/>
<line x1="180" y1="127" x2="180" y2="148" class="edge"/>
<line x1="298" y1="127" x2="298" y2="148" class="edge"/>
<line x1="62" y1="148" x2="298" y2="148" class="edge"/>
<line x1="180" y1="148" x2="180" y2="161" class="edge"/>

<rect x="84" y="161" width="192" height="26" class="node node-paper"/>
<text x="180" y="172" text-anchor="middle" class="t-title">Feasibility (common boundary)</text>
<text x="180" y="181.5" text-anchor="middle" class="t-label">Tp* band · η_MPPT(Tp) · net serves</text>
<text x="180" y="196" text-anchor="middle" class="t-micro">P = V·I (2 ADCs) · outcomes in Figs. 7–11</text>
</svg>
