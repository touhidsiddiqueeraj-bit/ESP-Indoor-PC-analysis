[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
upload_protocol = serial
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC=0
board_build.core = maple

